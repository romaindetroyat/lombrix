name: LOMBRIX first-frame verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/first-frame-v061.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install browser engines
        run: |
          python3 -m pip install playwright --quiet
          python3 -m playwright install --with-deps webkit chromium > /tmp/browser-install.log 2>&1
      - name: Sample decoded canvas pixels and real screenshots
        id: render
        continue-on-error: true
        run: timeout 150 python3 scripts/check-first-frame-v061.py
      - name: Preserve all visual diagnostics
        if: always()
        run: |
          git config user.name 'LOMBRIX build'
          git config user.email 'lombrix-build@users.noreply.github.com'
          git add reports/v061/first-frame
          git diff --cached --quiet || git commit -m 'Record unmodified public release first-frame rendering diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
          cd reports/v061
          zip -qr /tmp/LOMBRIX_v061_FIRST_FRAME.zip first-frame
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lombrix-first-frame
          path: /tmp/LOMBRIX_v061_FIRST_FRAME.zip
          retention-days: 3
      - name: Require rendered frames
        if: always()
        run: test '${{ steps.render.outcome }}' = success
