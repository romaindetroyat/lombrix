name: LOMBRIX independent WebKit pair
on:
  push:
    paths: ['.github/workflows/webkit-pair.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lombrix-requested-iphone-preview
  cancel-in-progress: false
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and WebKit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install playwright --quiet
          python3 -m playwright install --with-deps webkit > /tmp/webkit-install.log 2>&1
      - name: Verify two separate browsers
        id: pair
        continue-on-error: true
        run: |
          npx --no-install wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/local-worker.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl --silent --fail http://127.0.0.1:8787/health && break; sleep 1; done
          LOMBRIX_URL=http://127.0.0.1:8787 timeout 150 python3 scripts/check-webkit-pair.py
      - name: Preserve diagnostic and outcome
        if: always()
        run: |
          git config user.name 'LOMBRIX build'
          git config user.email 'lombrix-build@users.noreply.github.com'
          git add reports/local
          git diff --cached --quiet || git commit -m 'Save independent-process WebKit multiplayer validation'
          git push origin HEAD:main
      - name: Gate on measured outcome
        if: always()
        run: test '${{ steps.pair.outcome }}' = success
