name: LOMBRIX 0.6 iOS and visual acceptance
on:
  push:
    branches: ['fix/ios-controls-v060']
    paths: ['.github/workflows/validate-v060.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lombrix-v060-review
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-controls-v060
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve diagnostics and prepare corrected source
        run: |
          test "$GITHUB_REPOSITORY" = 'romaindetroyat/lombrix'
          mkdir -p reports/v060/history
          test ! -f reports/v060/gate.json || cp reports/v060/gate.json reports/v060/history/gate-before-$GITHUB_RUN_ID.json
          test ! -f reports/v060/interface.json || cp reports/v060/interface.json reports/v060/history/interface-before-$GITHUB_RUN_ID.json
          python3 scripts/fix-v060-framing.py
          for file in site/*.js *.mjs; do node --check "$file"; done
          node scripts/build-solo.mjs
          node scripts/prepare-release.mjs
          git config user.name 'LOMBRIX build'
          git config user.email 'lombrix-build@users.noreply.github.com'
          git add site scripts package.json package-lock.json solo.html BUILD.json wrangler.jsonc reports/v060/history
          git diff --cached --quiet || git commit -m 'Snap initial view to active worm before input; preserve prior failed acceptance evidence'
          git push origin HEAD:fix/ios-controls-v060
      - name: Engine and offline-shell regression tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          npm test | tee reports/v060/node-tests.tap
      - name: Prepare browsers and trust the ephemeral local certificate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install playwright --quiet
          python3 -m playwright install --with-deps webkit chromium > /tmp/browser-install.log 2>&1
          sudo apt-get install -y libnss3-tools > /tmp/nss-install.log 2>&1
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/lombrix-local.key -out /tmp/lombrix-local.crt -subj '/CN=LOMBRIX loopback acceptance' -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost' -addext 'extendedKeyUsage=serverAuth' > /tmp/local-tls.log 2>&1
          sudo cp /tmp/lombrix-local.crt /usr/local/share/ca-certificates/lombrix-local.crt
          sudo update-ca-certificates > /tmp/local-ca.log 2>&1
          mkdir -p "$HOME/.pki/nssdb"
          test -f "$HOME/.pki/nssdb/cert9.db" || certutil -N -d sql:"$HOME/.pki/nssdb" --empty-password
          certutil -A -d sql:"$HOME/.pki/nssdb" -n 'LOMBRIX loopback acceptance' -t 'C,,' -i /tmp/lombrix-local.crt
          npx --no-install wrangler dev --local --ip 127.0.0.1 --port 8787 --local-protocol https --https-key-path /tmp/lombrix-local.key --https-cert-path /tmp/lombrix-local.crt > /tmp/local-worker.log 2>&1 &
          echo $! > /tmp/lombrix-worker.pid
          for i in $(seq 1 40); do
            curl --silent --fail https://127.0.0.1:8787/health > /tmp/local-health.json && break
            sleep 1
          done
          test -s /tmp/local-health.json
      - name: Two-finger gestures and wheel over HTTPS in both engines
        id: interface
        continue-on-error: true
        run: LOMBRIX_URL=https://127.0.0.1:8787 LOMBRIX_REPORT_DIR=reports/v060 timeout 300 python3 scripts/check-v060.py
      - name: Two independent WebKit online players
        id: network
        continue-on-error: true
        run: LOMBRIX_URL=https://127.0.0.1:8787 LOMBRIX_REPORT_DIR=reports/v060/two-phones timeout 180 python3 scripts/check-two-phones.py
      - name: Offline solo with the origin actually stopped
        id: offline
        continue-on-error: true
        run: timeout 180 python3 scripts/check-offline-v060.py
      - name: Preserve all outcomes on the dedicated branch
        if: always()
        env:
          UNIT: ${{ steps.unit.outcome }}
          INTERFACE: ${{ steps.interface.outcome }}
          NETWORK: ${{ steps.network.outcome }}
          OFFLINE: ${{ steps.offline.outcome }}
        run: |
          mkdir -p reports/v060
          python3 - <<'PY'
          import os,json,datetime,subprocess
          from pathlib import Path
          result={'version':'0.6.0','repository':os.environ['GITHUB_REPOSITORY'],'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'run':os.environ['GITHUB_RUN_ID'],'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'physicalIPhone':False,'steps':{k:os.environ[k] for k in ['UNIT','INTERFACE','NETWORK','OFFLINE']}}
          result['allPassed']=all(v=='success' for v in result['steps'].values())
          Path('reports/v060/gate.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          git config user.name 'LOMBRIX build'
          git config user.email 'lombrix-build@users.noreply.github.com'
          git add reports/v060
          git diff --cached --quiet || git commit -m 'Record strict two-engine and two-player acceptance outcomes'
          git pull --rebase origin fix/ios-controls-v060
          git push origin HEAD:fix/ios-controls-v060
          git archive --format=zip -o /tmp/LOMBRIX_v0.6_REVIEW.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lombrix-v060-reviewed-game
          path: /tmp/LOMBRIX_v0.6_REVIEW.zip
          retention-days: 3
      - name: Require every independent gate to pass
        if: always()
        run: |
          test '${{ steps.unit.outcome }}' = success
          test '${{ steps.interface.outcome }}' = success
          test '${{ steps.network.outcome }}' = success
          test '${{ steps.offline.outcome }}' = success
